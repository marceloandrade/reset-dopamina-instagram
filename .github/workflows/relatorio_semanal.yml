name: Relatório semanal de crescimento

on:
  schedule:
    # Toda segunda-feira, 12:00 UTC (09h Brasília)
    - cron: "0 12 * * 1"
  workflow_dispatch: {} # permite rodar manualmente pelo botão "Run workflow", útil pra testar

permissions:
  contents: write # necessário pra salvar dados/historico_insights.json no repo

jobs:
  relatorio:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar relatório e avisar por WhatsApp
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_BRANCH: ${{ github.ref_name }}
        run: python relatorio_semanal.py
